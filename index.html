    />
    <script>
      // Set the theme before first paint so there's no flash.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>

  </body>
